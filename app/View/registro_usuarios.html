<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="../CSS/Registro_usuarios.css" />
</head>

<body class="register-bg">
    <div class="reg-wrap">
        <div class="reg-card">
            <div class="reg-header text-center mb-3">
                <img src="../Assets/Logo.png" alt="Logo" />
                <h1 class="mt-2 mb-0">Crear cuenta</h1>
                <p class="text-muted">Regístrate para comenzar</p>
            </div>

            <form action="#" method="post" autocomplete="off" id="Registro_usuario">
                <div class="row g-3">
                    <div class="col-sm-6">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="Nombre" name="Nombre" required />
                    </div>

                    <div class="col-sm-6">
                        <label for="apellido" class="form-label">Apellido</label>
                        <input type="text" class="form-control" id="Apellido" name="Apellido" required />
                    </div>

                    <div class="col-12">
                        <label for="identificacion" class="form-label">Identificación</label>
                        <input type="number" class="form-control" id="Identificacion" name="Identificacion" required />
                    </div>

                    <div class="col-12">
                        <label for="email" class="form-label">Correo</label>
                        <input type="email" class="form-control" id="Email" name="Email" placeholder="tu@correo.com"
                            required />
                    </div>

                    <div class="col-sm-6">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="Password" name="Password" required />
                    </div>
                    <div class="col-sm-6">
                        <label for="password2" class="form-label">Confirmar Contraseña</label>
                        <input type="password" class="form-control" id="password2" name="password2" required />
                    </div>
                    <div class="col-12">
                        <select class="form-select" aria-label="Default select example" id="Rol" name="Rol" required>
                            <option selected>¿Que rol eres?</option>
                            <option value="1">Usuario</option>
                            <option value="2">Doctor</option>
                            <option value="3">Administrador</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label for="telefono" class="form-label">Teléfono (opcional)</label>
                        <input type="tel" class="form-control" id="Telefono" name="Telefono" />
                    </div>

                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="1" id="terminos" required />
                            <label class="form-check-label" for="terminos">
                                Acepto los términos y condiciones
                            </label>
                        </div>
                    </div>
                </div>

                <div class="d-grid mt-3">
                    <button type="submit" class="btn btn-primary">Crear cuenta</button>
                </div>

                <div class="text-center mt-3">
                    <small class="text-muted">¿Ya tienes cuenta? <a href="Login.html">Inicia sesión</a></small>
                </div>
            </form>
        </div>
    </div>
    </div>


    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous">
        </script>
    <script src="../JS/Registro_usuarios.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
