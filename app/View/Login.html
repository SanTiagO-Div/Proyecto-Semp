<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="../CSS/login.css" />
</head>

<body class="login-bg">
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-header text-center mb-3">
                <img src="../Assets/Logo.png" alt="Logo" />
                <h1 class="mt-2 mb-0">Iniciar sesión</h1>
                <p class="text-muted">Accede a tu cuenta</p>
            </div>
            <form action="#" method="post" autocomplete="off" id="Login_form">
                <div class="mb-3">
                    <label for="email" class="form-label">Correo</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="tu@correo.com"
                        required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="********"
                        required>
                </div>
                <div class="mb-3">
                    <select class="form-select" aria-label="Default select example" id="Rol" name="Rol" required>
                        <option selected>¿Que rol eres?</option>
                        <option value="1">Usuario</option>
                        <option value="2">Doctor</option>
                        <option value="3">Administrador</option>
                    </select>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="remember">
                        <label class="form-check-label" for="remember">Recordarme</label>
                    </div>

                </div>
                <div class="align-items-center mb-4 px-2">
                    <a href="#" class="small">¿Olvidaste tu contraseña?</a>
                    <a href="../View/registro_usuarios.html" class="small">Me quiero registrar</a>
                </div>
                <button type="submit" class="btn btn-primary w-100" name="Btn_login" id="Btn_login">Entrar</button>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous">
        </script>
    <script src="../JS/Validacion_login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
